<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">GramForge</title>
  <desc id="desc">GramForge logo: a forged G above an anvil with the tagline Forge the Instagram you actually want.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#090b11"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.5" stop-color="#f43f8f"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(72 54)">
    <circle cx="126" cy="126" r="112" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="126" cy="126" r="92" fill="none" stroke="url(#forge)" stroke-opacity="0.22" stroke-width="2"/>

    <!-- sparks -->
    <g fill="url(#forge)" filter="url(#glow)">
      <path d="M31 58 l14 -5 l-5 14 z"/>
      <path d="M54 27 l8 -15 l6 18 z"/>
      <path d="M90 18 l4 -18 l8 17 z"/>
    </g>

    <!-- hammer -->
    <g transform="rotate(38 139 87)">
      <rect x="132" y="52" width="18" height="112" rx="8" fill="url(#forge)"/>
      <rect x="93" y="41" width="94" height="34" rx="10" fill="url(#forge)"/>
      <rect x="108" y="34" width="31" height="48" rx="9" fill="#ff9a2e"/>
    </g>

    <!-- anvil -->
    <path d="M46 153 H205 C210 153 213 158 210 162 L193 184 C188 191 181 195 172 195 H157 L166 210 H182 C188 210 192 214 192 220 V229 H61 V220 C61 214 65 210 71 210 H87 L96 195 H76 C67 195 61 191 56 184 L42 163 C39 158 42 153 46 153 Z" fill="url(#forge)"/>

    <!-- forged G mark -->
    <path d="M87 93 C87 63 108 42 141 42 C159 42 174 49 185 61 L168 78 C161 70 152 66 141 66 C123 66 112 77 112 94 C112 112 123 123 142 123 C153 123 162 120 168 114 V106 H141 V85 H192 V124 C180 139 163 147 141 147 C108 147 87 125 87 93 Z" fill="#f8fafc" fill-opacity="0.95"/>
  </g>

  <g transform="translate(350 88)">
    <text x="0" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#forge)">GramForge</text>
    <text x="5" y="142" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">Forge the Instagram you actually want.</text>
    <g transform="translate(5 178)">
      <rect width="142" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="19" cy="18" r="5" fill="#22c55e"/>
      <text x="34" y="24" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Open source</text>

      <rect x="156" width="172" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="175" cy="18" r="5" fill="#fb7185"/>
      <text x="190" y="24" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Ad-free builds</text>

      <rect x="342" width="184" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="361" cy="18" r="5" fill="#a78bfa"/>
      <text x="376" y="24" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">CLI automation</text>
    </g>
  </g>
</svg>
